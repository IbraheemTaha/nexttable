{% extends "base.html" %}

{% block title %}NextTable - {{ title }}{% endblock %}

{% block content %}
<h1 id="table-config-form-marker" class="text-2xl font-bold">{{ title }}</h1>

<form method="post" class="mt-4">
    {% csrf_token %}
    {{ form.non_field_errors }}

    {% for field in form %}
        <div class="mt-3">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}

    <button type="submit" class="mt-4">{{ submit_label }}</button>
    <a href="{% url 'restaurant:table_config_list' %}">Cancel</a>
</form>
{% endblock %}
