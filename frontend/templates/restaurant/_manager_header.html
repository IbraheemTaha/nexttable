<header class="app-header">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
        <div class="flex items-center gap-6">
            <a href="{% url 'restaurant:manager_landing' %}" class="app-brand">NextTable</a>
            <nav class="flex items-center gap-1">
                <a href="{% url 'restaurant:worker_account_list' %}" class="app-nav-link{% if 'worker_account' in request.resolver_match.url_name %} is-active{% endif %}">Workers</a>
                <a href="{% url 'restaurant:table_config_list' %}" class="app-nav-link{% if 'table_config' in request.resolver_match.url_name %} is-active{% endif %}">Tables</a>
                <a href="{% url 'restaurant:eta_config' %}" class="app-nav-link{% if 'eta' in request.resolver_match.url_name %} is-active{% endif %}">ETA rules</a>
            </nav>
        </div>
        <div class="flex items-center gap-3">
            <span class="hidden text-sm text-stone-500 sm:inline">{{ user.get_username }}</span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn-ghost btn-sm">Log out</button>
            </form>
        </div>
    </div>
</header>
