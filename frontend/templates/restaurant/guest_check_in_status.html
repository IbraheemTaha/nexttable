{% extends "base.html" %}

{% block title %}NextTable - Waitlist Status{% endblock %}

{% block content %}
<h1 id="guest-check-in-status-marker" class="text-2xl font-bold">You're on the waitlist</h1>

<dl class="mt-4" id="guest-waiting-summary">
    <dt>Guest name</dt>
    <dd>{{ entry.guest_name }}</dd>

    <dt>Party size</dt>
    <dd>{{ entry.party_size }}</dd>
</dl>

<section
    id="guest-waiting-status"
    class="mt-4"
    hx-get="{{ status_partial_url }}"
    hx-trigger="load, every 15s"
    hx-swap="innerHTML"
>
    {% include "restaurant/_guest_waiting_status.html" %}
</section>
{% endblock %}
