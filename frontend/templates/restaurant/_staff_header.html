<header class="app-header">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
        <div class="flex items-center gap-6">
            <a href="{% url 'restaurant:staff_landing' %}" class="app-brand">NextTable</a>
            <nav class="flex items-center gap-1">
                <a href="{% url 'restaurant:waitlist' %}" class="app-nav-link{% if request.resolver_match.url_name == 'waitlist' %} is-active{% endif %}">Waitlist</a>
                <a href="{% url 'restaurant:table_status' %}" class="app-nav-link{% if request.resolver_match.url_name == 'table_status' %} is-active{% endif %}">Tables</a>
            </nav>
        </div>
        <div class="flex items-center gap-3">
            <span class="hidden text-sm text-stone-500 sm:inline">{{ user.get_username }}</span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn-ghost btn-sm">Log out</button>
            </form>
        </div>
    </div>
</header>
