{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NextTable{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-stone-100 font-sans text-stone-900 antialiased">
    {% block body %}
    {% block app_header %}{% endblock %}
    <main class="mx-auto max-w-3xl px-4 py-8">
        {% block content %}{% endblock %}
    </main>
    {% endblock %}
</body>
</html>
