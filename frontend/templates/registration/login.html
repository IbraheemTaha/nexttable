{% extends "base.html" %}

{% block title %}NextTable - Login{% endblock %}

{% block body %}
<main class="flex min-h-screen items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <p class="app-brand text-center text-2xl">NextTable</p>
        <div class="card mt-6">
            <h1 class="section-title">Staff login</h1>
            <form method="post" class="mt-4">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-primary mt-2 w-full">Log in</button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
