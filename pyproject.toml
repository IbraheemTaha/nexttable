[project]
name = "nexttable"
version = "0.1.0"
description = "NextTable - restaurant waitlist and table management"
authors = [
    { name = "Ibraheem Taha", email = "ibraheemtaha@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django==5.0.9",
    "python-dotenv==1.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-django==4.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["backend"]
